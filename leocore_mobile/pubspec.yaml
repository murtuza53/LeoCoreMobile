name: leocore_mobile
description: "LeoCore ERP Mobile — companion app for LeoCore ERP (Bahrain)."
publish_to: 'none'
version: 2.8.0+10

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  google_fonts: ^6.2.1
  intl: any
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^7.4.0
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  in_app_review: ^2.0.10
  in_app_update: ^4.2.3
  package_info_plus: ^8.1.2
  printing: ^5.13.4
  open_filex: ^4.5.0
  # Uses the Android Photo Picker on API 33+, so gallery access needs no
  # READ_MEDIA_* permissions (Play "Photo and Video Permissions" policy).
  image_picker: ^1.1.2
  # Attach Docs: pick files from device storage / iCloud / Drive (Files app).
  file_picker: ^8.1.2
  # Advanced document scanning: native edge detection, perspective (skew)
  # correction and colour/brightness enhancement (VisionKit on iOS, ML Kit
  # Document Scanner on Android). Multi-page capture.
  cunning_document_scanner: ^1.2.3
  # Build a multi-page PDF from scanned/picked images (pure Dart, no native).
  pdf: ^3.11.0
  # Camera permission handling for the document scanner (direct-dep so we can
  # pre-request + open app settings when the user denied it).
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# Launcher icon generation: `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/ic_full.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/ic_fore.png"
  remove_alpha_ios: true
